[package]
name = "esmorph-py"
description = "Python module of the esMorph morphological analyzer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_esmorph"
crate-type = ["cdylib"]

[dependencies]
esmorph = { path = "../esmorph", default-features = false, features = ["cli"] }
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }
