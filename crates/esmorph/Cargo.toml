[package]
name = "esmorph"
description = "Fast Spanish morphological analyzer: lemmas, Universal Dependencies features and inflection"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://sergeyshk.github.io/esMorph/"
readme = "README.md"
keywords = ["morphology", "spanish", "lemmatization", "conjugation", "nlp"]
categories = ["text-processing"]

[features]
default = ["bundled"]
# The dictionary of esMorph from the crate esmorph-dict-es: Dictionary::bundled
bundled = ["dep:esmorph-dict-es"]
# The analysis of a document of the anySeg segmenter: Dictionary::annotate
anyseg = ["dep:anyseg"]
# The esmorph command: cargo install esmorph --features cli
cli = ["anyseg"]
# Building dictionaries: Builder
build = []

[[bin]]
name = "esmorph"
required-features = ["cli"]

[dependencies]
anyseg = { version = "0.3.0", optional = true, default-features = false, features = ["es"] }
bytemuck = "1.25.2"
crc32fast = "1.5.3"
esmorph-dict-es = { version = "=0.2.0-dev.2", path = "../esmorph-dict-es", optional = true }
fst = "0.4.7"
memmap2 = "0.9.11"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
