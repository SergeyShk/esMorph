[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "esmorph"
version = "0.1.0.dev8"
description = "Fast Spanish morphological analyzer written in Rust with a Python API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT AND CC-BY-SA-4.0"
license-files = ["LICENSE.txt", "LICENSE-DICTIONARY.txt", "THIRD-PARTY-NOTICES.txt"]
authors = [{ name = "Sergey Shkarin", email = "kouki.sergey@gmail.com" }]
maintainers = [{ name = "Sergey Shkarin", email = "kouki.sergey@gmail.com" }]
keywords = [
    "morphology",
    "morphological analysis",
    "lemmatization",
    "conjugation",
    "Universal Dependencies",
    "Wiktionary",
    "NLP",
    "spanish",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 3 - Stable",
    "Programming Language :: Rust",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
    "Natural Language :: Spanish",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/SergeyShk/esMorph"
Repository = "https://github.com/SergeyShk/esMorph"
Issues = "https://github.com/SergeyShk/esMorph/issues"

[tool.maturin]
manifest-path = "crates/esmorph-py/Cargo.toml"
module-name = "esmorph._esmorph"
python-source = "python"
include = [{ path = "python/esmorph/data/es.dict", format = ["sdist", "wheel"] }]
sdist-generator = "git"

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "crates/**/Cargo.toml" },
    { file = "crates/**/*.rs" },
]

[dependency-groups]
test = ["pytest>=8.3", "pytest-cov>=6.0"]
lint = ["mypy>=1.14", "pre-commit>=4.0", "ruff>=0.9"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-static-i18n>=1.2",
    "pymdown-extensions>=10.0",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "docs" },
]

[tool.ruff]
target-version = "py311"
line-length = 99
src = ["python", "scripts", "tests"]

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "C90",  # mccabe
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "PERF", # perflint
    "PTH",  # flake8-use-pathlib
    "Q",    # flake8-quotes
    "RET",  # flake8-return
    "RUF",  # ruff-specific
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.isort]
known-first-party = ["esmorph"]
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N801", "N802"]

[tool.mypy]
python_version = "3.11"
files = ["python/esmorph"]
pretty = true
show_traceback = true
color_output = true
allow_redefinition = false
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
ignore_missing_imports = true
implicit_reexport = false
no_implicit_optional = true
show_column_numbers = true
show_error_codes = true
show_error_context = true
strict_equality = true
strict_optional = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
addopts = "-v --strict-markers --strict-config --doctest-modules --doctest-ignore-import-errors"
testpaths = ["tests", "python/esmorph"]
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]

[tool.coverage.run]
source = ["esmorph"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:"]
